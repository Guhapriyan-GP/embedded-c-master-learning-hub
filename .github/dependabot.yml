# Dependabot configuration for GitHub Actions supply-chain hygiene
# Monitors SHA-pinned actions in .github/workflows/ on a weekly schedule.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
      - "security"
    groups:
      github-actions-updates:
        patterns:
          - "*"
